<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DorkSeek - A powerful tool for advanced Google Dork usage in OSINT, designed to optimize the creation of custom search queries and analysis of results.">
    <meta name="robots" content="index, follow">
    <meta name="keywords" content="Google Dorks, búsqueda avanzada, operadores de búsqueda, hacking ético, seguridad informática, OSINT, ciberseguridad, técnicas de hacking, Google Hacking Database, comandos de Google Dorks">
    <!-- Varios tamaños/formatos: la pestaña del navegador acepta cualquier
         tamaño, pero "Nueva pestaña" de Firefox (y accesos directos tipo PWA)
         exige un icono de al menos 96x96 o SVG, si no cae a uno genérico. -->
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="img/fv.ico" sizes="any">
    <link rel="apple-touch-icon" href="img/favicon-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>DorkSeek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <!-- Precarga el logo oscuro para evitar parpadeos al cambiar a dark mode -->
    <link rel="preload" as="image" href="img/DorkSeek_Logo_dark.jpg">
    <meta name="google-site-verification" content="KBBp8snCi14scIXK39u9ytrFKHahNvsQoX6dvnZJ_Ps" />
</head>
<body>
    <div class="container">
        <div style="height: 20px;"></div>
        <img src="img/DorkSeek_Logo.jpg" alt="DorkSeek" class="logo" width="690" height="100" style="display: block; margin: 30px auto;">
        <h1 class="text-center my-0" id="pageHeading">Buscador Google Dorks</h1>
        <div class="row justify-content-center">
            <div class="search-shell">
                <span class="search-icon-slot">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <input id="searchBar" type="text" class="form-control" placeholder="Introduce tu búsqueda">
            </div>
        </div>
        <div class="row mt-4 justify-content-center">
            <button id="clearFiltersButton" class="btn btn-sm mx-2" style="width: 130px;">Borrar Filtros</button>
        </div>
        <div class="row mt-3">
            <!-- Filtros para los diferentes Google Dorks -->
            <div class="col-md-4">
                <label for="filetypeFilterEntry">Tipo de archivo (filetype:)</label>
                <div class="tag-input" data-for="filetypeFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="filetypeFilterEntry" type="text" class="tag-input-entry" list="filetypes" placeholder="Ej: 'pdf' + Intro" title="Busca uno o varios tipos de archivo en los resultados (filetype:pdf OR filetype:doc).&#10;&#10;Escribe un valor y pulsa Intro para añadirlo como etiqueta; puedes añadir varios.&#10;&#10;Para tipos con varias extensiones habituales (doc/docx, xls/xlsx, ppt/pptx, html/htm, jpg/jpeg, tiff/tif, xsl/xslt) cada etiqueta se expande automáticamente (filetype:doc OR filetype:docx), ya que Google no agrupa esas extensiones.">
                </div>
                <input type="hidden" id="filetypeFilter">
                <datalist id="filetypes">
                    <option value="txt">.txt</option>
                    <option value="doc">.doc / .docx</option>
                    <option value="pdf">.pdf</option>
                    <option value="xls">.xls / .xlsx</option>
                    <option value="ppt">.ppt / .pptx</option>
                    <option value="csv">.csv</option>
                    <option value="html">.html / .htm</option>
                    <option value="xml">.xml</option>
                    <option value="json">.json</option>
                    <option value="jpg">.jpg / .jpeg</option>
                    <option value="png">.png</option>
                    <option value="gif">.gif</option>
                    <option value="bmp">.bmp</option>
                    <option value="tiff">.tiff / .tif</option>
                    <option value="mp3">.mp3</option>
                    <option value="wav">.wav</option>
                    <option value="avi">.avi</option>
                    <option value="mp4">.mp4</option>
                    <option value="mov">.mov</option>
                    <option value="zip">.zip</option>
                    <option value="rar">.rar</option>
                    <option value="7z">.7z</option>
                    <option value="iso">.iso</option>
                    <option value="md">.md</option>
                    <option value="sql">.sql</option>
                    <option value="psd">.psd</option>
                    <option value="ai">.ai</option>
                    <option value="indd">.indd</option>
                    <option value="eps">.eps</option>
                    <option value="svg">.svg</option>
                    <option value="webp">.webp</option>
                    <option value="mkv">.mkv</option>
                    <option value="flv">.flv</option>
                    <option value="ogg">.ogg</option>
                    <option value="m4a">.m4a</option>
                    <option value="dmg">.dmg</option>
                    <option value="pkg">.pkg</option>
                    <option value="bat">.bat</option>
                    <option value="sh">.sh</option>
                    <option value="log">.log</option>
                    <option value="jar">.jar</option>
                    <option value="class">.class</option>
                    <option value="cpp">.cpp</option>
                    <option value="py">.py</option>
                    <option value="java">.java</option>
                    <option value="rb">.rb</option>
                    <option value="php">.php</option>
                    <option value="pl">.pl</option>
                    <option value="sqlite">.sqlite</option>
                    <option value="db">.db</option>
                    <option value="xsd">.xsd</option>
                    <option value="xsl">.xsl / .xslt</option>
                    <option value="ini">.ini</option>
                    <option value="cfg">.cfg</option>
                    <option value="conf">.conf</option>
                    <option value="reg">.reg</option>
                    <option value="bak">.bak</option>
                    <option value="tar">.tar</option>
                    <option value="gz">.gz</option>
                    <option value="bz2">.bz2</option>
                    <option value="env">.env</option>
                    <option value="yml">.yml / .yaml</option>
                    <option value="pem">.pem</option>
                    <option value="key">.key</option>
                </datalist>
            </div>
            <div class="col-md-4">
                <label for="exactMatchFilterEntry">Coincidencia exacta ("")</label>
                <div class="tag-input" data-for="exactMatchFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="exactMatchFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: 'texto exacto' + Intro" title="Busca páginas que contengan el texto exacto de cada etiqueta.&#10;&#10;Escribe una frase y pulsa Intro para añadirla; con varias etiquetas se exige que aparezcan TODAS (&quot;frase 1&quot; &quot;frase 2&quot;), no basta con una.">
                </div>
                <input type="hidden" id="exactMatchFilter">
            </div>
            <div class="col-md-4">
                <label for="siteFilterEntry">Dominio (site:)</label>
                <div class="tag-input" data-for="siteFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="siteFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: example.com + Intro" title="Limita los resultados a uno o varios dominios (site:a.com OR site:b.com).&#10;&#10;Escribe un dominio y pulsa Intro para añadirlo como etiqueta; puedes añadir varios.">
                </div>
                <input type="hidden" id="siteFilter">
            </div>
            <div class="col-md-4">
                <label for="intitleFilterEntry">Título contiene (intitle:)</label>
                <div class="tag-input" data-for="intitleFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="intitleFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: index of + Intro" title="Busca páginas donde el título contenga cada etiqueta.&#10;&#10;Si una etiqueta tiene varias palabras se entrecomilla automáticamente (intitle:&quot;index of&quot;) para que Google la trate como una frase. Con varias etiquetas se exige que aparezcan TODAS (intitle:&quot;a&quot; intitle:&quot;b&quot;), no basta con una.">
                </div>
                <input type="hidden" id="intitleFilter">
            </div>
            <div class="col-md-4">
                <label for="inurlFilterEntry">URL contiene (inurl:)</label>
                <div class="tag-input" data-for="inurlFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="inurlFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: admin panel + Intro" title="Busca páginas donde la URL contenga cada etiqueta.&#10;&#10;Si una etiqueta tiene varias palabras se entrecomilla automáticamente (inurl:&quot;admin panel&quot;). Con varias etiquetas se exige que aparezcan TODAS (inurl:&quot;a&quot; inurl:&quot;b&quot;), no basta con una.">
                </div>
                <input type="hidden" id="inurlFilter">
            </div>
            <div class="col-md-4">
                <label for="intextFilterEntry">Texto (intext:)</label>
                <div class="tag-input" data-for="intextFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="intextFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: texto en el cuerpo + Intro" title="Busca páginas que contengan cada etiqueta en el cuerpo.&#10;&#10;Las etiquetas con varias palabras se entrecomillan automáticamente. Con varias etiquetas se exige que aparezcan TODAS, no basta con una.">
                </div>
                <input type="hidden" id="intextFilter">
            </div>
            <div class="col-md-4">
                <label for="allinurlFilterEntry">Todo en URL (allinurl:)</label>
                <div class="tag-input" data-for="allinurlFilter" data-joiner="space">
                    <div class="tag-input-chips"></div>
                    <input id="allinurlFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: texto + Intro" title="Busca páginas donde la URL contenga TODAS las etiquetas (allinurl: exige que aparezcan todas, no es OR).&#10;&#10;No lo combines con otros operadores en la misma búsqueda: Google no garantiza resultados fiables cuando allin* se mezcla con filtros como site: o intitle:.">
                </div>
                <input type="hidden" id="allinurlFilter">
            </div>
            <div class="col-md-4">
                <label for="allintitleFilterEntry">Todo en título (allintitle:)</label>
                <div class="tag-input" data-for="allintitleFilter" data-joiner="space">
                    <div class="tag-input-chips"></div>
                    <input id="allintitleFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: texto + Intro" title="Busca páginas cuyo título contenga TODAS las etiquetas (allintitle: exige que aparezcan todas, no es OR).&#10;&#10;No lo combines con otros operadores en la misma búsqueda: Google no garantiza resultados fiables cuando allin* se mezcla con filtros como site: o intitle:.">
                </div>
                <input type="hidden" id="allintitleFilter">
            </div>
            <div class="col-md-4">
                <label for="allintextFilterEntry">Todo en texto (allintext:)</label>
                <div class="tag-input" data-for="allintextFilter" data-joiner="space">
                    <div class="tag-input-chips"></div>
                    <input id="allintextFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: texto + Intro" title="Busca páginas cuyo cuerpo contenga TODAS las etiquetas (allintext: exige que aparezcan todas, no es OR).&#10;&#10;No lo combines con otros operadores en la misma búsqueda: Google no garantiza resultados fiables cuando allin* se mezcla con filtros como site: o intitle:.">
                </div>
                <input type="hidden" id="allintextFilter">
            </div>
            <div class="col-md-4">
                <label for="defineFilterEntry">Definir (define:)</label>
                <div class="tag-input" data-for="defineFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="defineFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: ejemplo + Intro" title="Busca definiciones de términos directamente en Google. No documentado por Google; sin utilidad real en OSINT.&#10;&#10;Con varias etiquetas se exige que aparezcan TODAS.">
                </div>
                <input type="hidden" id="defineFilter">
            </div>
            <div class="col-md-4">
                <label for="siteExcludeFilterEntry">Excluir dominio (-site:)</label>
                <div class="tag-input" data-for="siteExcludeFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="siteExcludeFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: example.com + Intro" title="Excluye resultados de uno o varios dominios.&#10;&#10;Escribe un dominio y pulsa Intro para añadirlo como etiqueta; puedes añadir varios.">
                </div>
                <input type="hidden" id="siteExcludeFilter">
            </div>
            <div class="col-md-4">
                <label for="excludeTermFilterEntry">Excluir término (-)</label>
                <div class="tag-input" data-for="excludeTermFilter" data-joiner="comma">
                    <div class="tag-input-chips"></div>
                    <input id="excludeTermFilterEntry" type="text" class="tag-input-entry" placeholder="Ej: forum + Intro" title="Excluye páginas que contengan cada etiqueta.&#10;&#10;Escribe un término y pulsa Intro para añadirlo; puedes añadir varios.">
                </div>
                <input type="hidden" id="excludeTermFilter">
            </div>
            <div class="col-12">
                <div class="date-range-row">
                    <input id="afterFilter" type="date" class="form-control date-edge" aria-label="Después (after:)" title="Limita los resultados a páginas publicadas después de esta fecha.&#10;&#10;Operador en beta desde 2019: puede dar resultados inconsistentes porque depende de metadatos de fecha que muchos sitios no gestionan bien.">
                    <div class="date-range" id="dateRangeControl">
                        <div class="date-range-track"></div>
                        <div class="date-range-fill" id="dateRangeFill"></div>
                        <input type="range" id="afterRange" class="date-range-input" step="1" aria-label="Fecha desde (after:)">
                        <input type="range" id="beforeRange" class="date-range-input" step="1" aria-label="Fecha hasta (before:)">
                    </div>
                    <input id="beforeFilter" type="date" class="form-control date-edge" aria-label="Antes (before:)" title="Limita los resultados a páginas publicadas antes de esta fecha.&#10;&#10;Operador en beta desde 2019: puede dar resultados inconsistentes porque depende de metadatos de fecha que muchos sitios no gestionan bien.">
                </div>
            </div>
            <div class="col-12">
                <div id="dorkWarning" class="alert alert-warning py-2 px-3" role="alert" hidden>
                    Estás combinando un operador <code>allin*</code> (allintitle/allinurl/allintext) con otros filtros en la misma búsqueda. Google no garantiza resultados fiables en ese caso; considera usarlo solo, sin otros operadores.
                </div>
                <div class="options-panel">
                    <div class="options-grid">
                        <label class="option-item" for="excludeAI">
                            <input class="form-check-input" type="checkbox" id="excludeAI" title="Filtro heurístico: excluye páginas cuyo dominio o texto contiene términos típicos de IA (chatgpt, copilot, bard, etc).&#10;&#10;Advertencia: no detecta contenido generado por IA de verdad, solo esas palabras clave, y puede ocultar resultados relevantes que simplemente las mencionen. Para quitar la capa de IA de Google (AI Overviews), usa 'Vista Web clásica'.">
                            <span data-i18n-text>Excluir términos típicos de IA (heurístico)</span>
                        </label>
                        <label class="option-item" for="classicWeb">
                            <input class="form-check-input" type="checkbox" id="classicWeb" title="Añade el parámetro udm=14 a la URL de Google, que muestra la pestaña 'Web' clásica sin AI Overviews ni resúmenes generados por IA.&#10;&#10;Parámetro no documentado, obtenido por ingeniería inversa: puede dejar de funcionar sin aviso.">
                            <span data-i18n-text>Vista Web clásica (sin AI Overviews)</span>
                        </label>
                        <label class="option-item" for="literalMode">
                            <input class="form-check-input" type="checkbox" id="literalMode" title="Añade el parámetro tbs=li:1 a la URL de Google, que desactiva sinónimos y corrección ortográfica automática (búsqueda literal).&#10;&#10;Parámetro no documentado, obtenido por ingeniería inversa: puede dejar de funcionar sin aviso.">
                            <span data-i18n-text>Modo literal (sin sinónimos)</span>
                        </label>
                        <label class="option-item" for="driveIndexado">
                            <input class="form-check-input" type="checkbox" id="driveIndexado" title="Busca documentos y carpetas indexados en Google Drive (drive.google.com) y Google Docs/Sheets/Slides compartidos (docs.google.com), excluyendo páginas de inicio de sesión.">
                            <span data-i18n-text>Buscar en Google Drive / Docs</span>
                        </label>
                    </div>
                    <div class="switches-row">
                        <div class="lang-switch" role="group" aria-label="Idioma de la interfaz / Interface language">
                            <button type="button" class="lang-option is-active" id="langEs" data-lang="es" aria-pressed="true">ES</button>
                            <button type="button" class="lang-option" id="langEn" data-lang="en" aria-pressed="false">EN</button>
                        </div>
                        <div class="form-check form-switch">
                            <label class="form-check-label" for="toggle_dark" id="dark_text">Dark Mode</label>
                            <input class="form-check-input" type="checkbox" role="switch" id="toggle_dark">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4 justify-content-center">
            <button id="searchButton" class="btn btn-primary">Buscar en Google</button>
        </div>

        <p style="font-style: italic; color: #868686; font-size: 0.6em; text-align: center; margin-top: 15px;">
            by <a href="https://github.com/ENDE25" style="color: inherit; text-decoration: none; cursor: pointer;">ENDE</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
